# Decap CMS configuration for Jekyll + GitHub Pages
backend:
  name: git-gateway
  branch: main

site_url: https://vandoitruong.github.io
media_folder: assets/uploads
public_folder: /assets/uploads

# Collections
collections:
  - name: posts
    label: Posts
    folder: _posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string", required: true, hint: "Post title (shown on listings and page header)" }
      - { label: "Description", name: "description", widget: "string", required: true, hint: "Short summary under the title on listings" }
      - { label: "Publish Date", name: "date", widget: "datetime", required: true, hint: "Publish date/time (used in slug and sort)" }
      - { label: "Tags", name: "tags", widget: "list", required: false, hint: "List of tags (e.g., [formatting, links])" }
      - { label: "Categories", name: "categories", widget: "list", required: false, hint: "List of categories (e.g., [sample-posts])" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false, hint: "Optional image shown on list cards (assets/... path)" }
      - { label: "Body", name: "body", widget: "markdown", required: true, hint: "Main content in Markdown" }

  - name: news
    label: News
    folder: _news
    create: true
    slug: "announcement_{{order}}"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "post" }
      - { label: "Title", name: "title", widget: "string", required: true, hint: "News headline" }
      - { label: "Order", name: "order", widget: "number", required: true, hint: "Numeric order used in filename (e.g., 1, 2)" }
      - { label: "Date", name: "date", widget: "datetime", required: true, hint: "Publish date/time" }
      - { label: "Inline", name: "inline", widget: "boolean", default: false, hint: "true for short inline update, false for full announcement" }
      - { label: "Related Posts", name: "related_posts", widget: "boolean", default: false, hint: "Show related posts section under the news" }
      - { label: "Body", name: "body", widget: "markdown", required: true, hint: "News content in Markdown" }

  - name: projects
    label: Projects
    folder: _projects
    create: true
    slug: "{{importance}}_project"
    editor:
      preview: false
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
      - { label: "Title", name: "title", widget: "string", required: true, hint: "Project title (e.g., 'project 1')" }
      - { label: "Description", name: "description", widget: "string", required: true, hint: "Short summary shown in listings (e.g., 'with background image')" }
      - { label: "Background Image", name: "img", widget: "image", required: false, hint: "Path under assets/img/ (e.g., assets/img/12.jpg)" }
      - { label: "Importance (Order)", name: "importance", widget: "number", required: true, hint: "Numeric order used at start of filename (e.g., 1, 2)" }
      - { label: "Category", name: "category", widget: "string", required: false, hint: "Category tag (e.g., work, research)" }
      - { label: "Related Publications", name: "related_publications", widget: "boolean", default: false, hint: "Toggle to show related publications" }
      - { label: "Body", name: "body", widget: "markdown", required: true, hint: "Main project content; you can use figure.liquid includes and Bootstrap rows/cols" }
